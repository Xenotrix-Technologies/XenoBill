publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  go_router: ^12.1.3
  intl: ^0.18.1
  uuid: ^4.2.2
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  dio: ^5.4.0
  json_annotation: ^4.8.1
  fl_chart: ^0.66.0
